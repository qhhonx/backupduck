<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BackupDuck · Apple media interactions</title>
<style>
:root{font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:#202a38;background:#eeeae4;--blue:#1761d5;--surface:#fff;--canvas:#f7f5ef;--border:#e0e5eb}*{box-sizing:border-box}body{margin:0;padding:24px}button,input{font:inherit}button{cursor:pointer;border:0;color:var(--blue);background:#edf2fa;border-radius:10px;padding:10px 16px}button:focus-visible{outline:3px solid #eec449}header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1200px;margin:auto auto 20px}header p{font-size:13px;color:#697486}.controls{display:flex;gap:8px;flex-wrap:wrap}.shell{position:relative;width:390px;height:844px;margin:auto;background:var(--canvas);border-radius:28px;box-shadow:0 20px 70px #202a3820;overflow:hidden}.shell.mac{width:min(1160px,100%);height:760px;border-radius:16px}.bar{height:76px;padding:22px 20px 14px;background:white;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border)}.bar h2{font-size:20px;margin:0}.bar p{font-size:12px;color:#6b7789;margin:4px 0 0}.content{height:calc(100% - 76px);overflow:auto;padding:20px}.group{border:1px solid var(--border);border-radius:16px;background:white;overflow:hidden;margin-bottom:24px}.row{width:100%;display:flex;align-items:center;text-align:left;justify-content:space-between;gap:16px;background:white;color:inherit;min-height:56px;border-radius:0;padding:14px 16px;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.row small,.muted{color:#6d7788}.switch{width:42px;height:26px;border-radius:99px;background:#babdc2;padding:3px;flex-shrink:0}.switch:after{content:'';display:block;background:white;border-radius:50%;width:20px;height:20px}.switch.on{background:var(--blue)}.switch.on:after{margin-left:16px}.mac .row{min-height:48px;font-size:14px;padding:10px 20px}.mac .content{padding:28px}.mac .columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.mac h3{font-size:16px}.mac .group h3{padding:20px 20px 0;margin:0 0 8px}.search{width:100%;background:#e9edf2;border:0;border-radius:10px;padding:12px;margin-bottom:14px}.check{color:var(--blue);font-weight:600;font-size:20px}.album{display:flex;align-items:center;gap:12px}.cover,.photo{background:linear-gradient(140deg,hsl(var(--h) 35% 73%) 0 42%,hsl(calc(var(--h) + 25) 24% 49%) 42% 64%,hsl(var(--h) 30% 29%) 64%);position:relative;overflow:hidden}.cover{width:44px;height:44px;border-radius:8px}.photo:after,.cover:after{content:'';position:absolute;width:18%;height:18%;border-radius:50%;background:#fff7bd;top:15%;right:15%}.grid{position:relative;margin:0 -20px;height:1700px}.tile{position:absolute;border:0;border-radius:0;padding:0;transition:none}.tile small{position:absolute;bottom:5px;right:5px;font-size:11px;background:#0005;color:white;border-radius:3px;padding:2px}.viewer{position:absolute;inset:0;background:#000;color:white;z-index:3;display:flex;flex-direction:column}.viewer .head,.viewer .foot{display:flex;align-items:center;justify-content:space-between;padding:18px;position:absolute;left:0;right:0;z-index:3;transition:opacity .2s}.viewer .head{top:20px}.viewer .foot{bottom:16px}.viewer button{background:#ffffff1e;color:white;border-radius:99px;min-width:44px;min-height:44px}.viewer .date{text-align:center;font-size:14px;line-height:1.5}.stage{position:absolute;inset:110px 0 96px;transition:bottom .3s cubic-bezier(.2,.8,.2,1);overflow:hidden;display:flex}.track{display:flex;gap:12px;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;align-items:center}.large{flex:0 0 100%;height:70%;scroll-snap-align:center}.drawer{position:absolute;bottom:0;left:0;right:0;height:0;background:#1c1d20;border-radius:22px 22px 0 0;overflow:auto;transition:height .3s cubic-bezier(.2,.8,.2,1);padding:0 24px}.drawer:before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:#74767b;margin:12px auto 20px}.drawer h3{font-size:20px}.drawer dl{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:14px}.drawer dd{margin:0;text-align:right;color:#bfc4ce}.viewer.info .drawer{height:45%}.viewer.info .stage{bottom:45%}.viewer.info .foot{display:none}.viewer.hidden .head,.viewer.hidden .foot{opacity:0;pointer-events:none}.scrim{position:absolute;inset:0;background:#0005;z-index:10;display:flex;align-items:flex-end}.dialog{width:100%;background:white;border-radius:22px 22px 0 0;color:#202a38}.dialog h2{font-size:22px;padding:20px;margin:0;border-bottom:1px solid var(--border)}.dialog p{padding:20px;margin:0;line-height:1.6}.dialog .actions{border-top:1px solid var(--border);padding:20px;display:flex;justify-content:flex-end;gap:12px}.primary{background:var(--blue);color:white}.mac .scrim{align-items:center;justify-content:center}.mac .dialog{width:520px;border-radius:20px}.reduced *{transition:none!important} @media(max-width:700px){body{padding:10px}.shell{width:min(390px,100%)}header{align-items:flex-start;flex-direction:column}}
</style>
<header><div><strong>BackupDuck · Apple media interaction reference</strong><p>Synthetic media. Drag the detail horizontally; use the density slider to inspect intermediate grid frames.</p></div><div class="controls"><button data-platform="phone">iPhone</button><button data-platform="mac">Mac</button><button data-route="gallery">Library</button><button data-route="settings">Settings</button><button data-route="scope">Backup scope</button><button id="consent">Cloud consent</button><label><input type="checkbox" id="reduce"> Reduce motion</label></div></header><main class="shell" id="shell"></main>
<script>
const shell=document.querySelector('#shell');let route=new URLSearchParams(location.search).get('screen')||'gallery',platform=new URLSearchParams(location.search).get('platform')==='mac'?'mac':'phone',selected=0,density=3,cloud=false,types=new Set(['photo','motion','video','burst']),albums=new Set(),restricted=false;
const kinds=[['photo','Photos'],['motion','Live Photos'],['video','Videos'],['burst','Bursts']];
function row(label,value,action){return `<button class="row" data-go="${action}"><span>${label}</span><span class="muted">${value} ›</span></button>`}
function frame(title,body){return `<div class="bar">${['types','albums'].includes(route)?'<button data-go="back">‹</button>':'<span></span>'}<h2>${title}</h2><span></span></div><div class="content">${body}</div>`}
function paint(){shell.className='shell '+(platform==='mac'?'mac':'');if(route==='gallery'){shell.innerHTML=frame('Photo library',`<div class="controls"><button data-density="3">Days</button><button data-density="7">Months</button><input aria-label="Density transition" type="range" min="3" max="9" step=".05" value="${density}" id="density"></div><h3>12 October 2026</h3><div class="grid"></div>`);let grid=shell.querySelector('.grid');for(let i=0;i<108;i++){let b=document.createElement('button');b.className='tile photo';b.style.setProperty('--h',170+i*27%160);b.dataset.photo=i;b.innerHTML='<small>'+((i%4===0)?'LIVE':'')+'</small>';grid.append(b)}layout(density)}else if(route==='settings'){shell.innerHTML=frame('Settings',`<div class="columns"><div><div class="group"><h3>Device identity</h3>${row('Device name','Example Mac','noop')}</div><div class="group"><h3>Photo library</h3><button class="row" data-go="cloud-toggle"><span>Load previews from iCloud<br><small>Clear previews while browsing; may use cellular data. Does not start a backup. When off, only on-device previews load.</small></span><span class="switch ${cloud?'on':''}"></span></button></div></div><div><div class="group"><h3>Display and language</h3>${row('Appearance','System','noop')}${row('Language','English','noop')}${row('List display','','noop')}</div><div class="group"><h3>Local storage</h3>${row('Local cache','0 KB / 5 GB','noop')}</div></div></div>`)}else if(route==='scope'){shell.innerHTML=frame('Backup settings',`<h3>Backup scope</h3><div class="group">${row('Media types',types.size===4?'All types':types.size+' selected','types')}${row('Specified albums',restricted&&albums.size?albums.size+' selected':'All albums','albums')}</div><p class="muted">Applies to new photos and the next existing-photo scan.</p>`)}else if(route==='types'){shell.innerHTML=frame('Media types',`<div class="group">${kinds.map(([id,title])=>`<button class="row" data-type="${id}"><span>${title}</span><span class="check">${types.has(id)?'✓':''}</span></button>`).join('')}</div>`)}else if(route==='albums'){shell.innerHTML=frame('Specified albums',`<input class="search" placeholder="Search albums" aria-label="Search albums"><div class="group"><button class="row" data-go="all-albums"><span>All albums</span><span class="check">${restricted?'':'✓'}</span></button></div><h3>My albums · ${albums.size} selected</h3><div class="group" id="albums">${Array.from({length:100},(_,i)=>`<button class="row" data-album="${i}"><span class="album"><span class="cover" style="--h:${i*31%360}"></span><span>${['Family','Travel','Camera','Trips'][i%4]} ${i+1}<br><small>${14+i} items</small></span></span><span class="check">${albums.has(i)?'✓':''}</span></button>`).join('')}</div>`)} }
function layout(c){let grid=shell.querySelector('.grid');if(!grid)return;let width=grid.clientWidth,gap=2,low=[3,5,7,9].filter(n=>n<=c).at(-1)||3,high=[3,5,7,9].find(n=>n>=c)||9,t=low===high?0:((width-gap*(low-1))/low-(width-gap*(c-1))/c)/((width-gap*(low-1))/low-(width-gap*(high-1))/high);grid.querySelectorAll('.tile').forEach((b,i)=>{let f=n=>{let side=(width-gap*(n-1))/n;return[(i%n)*(side+gap),Math.floor(i/n)*(side+gap),side]};let a=f(low),z=f(high);b.style.left=(a[0]+(z[0]-a[0])*t)+"px";b.style.top=(a[1]+(z[1]-a[1])*t)+"px";b.style.width=b.style.height=(a[2]+(z[2]-a[2])*t)+"px";b.querySelector('small').hidden=c>=7})}
function viewer(i){selected=i;const v=document.createElement('div');v.className='viewer';v.innerHTML=`<div class="head"><button data-close>‹</button><div class="date">12 October 2026<br><small>18:43</small></div><button data-info>ⓘ</button></div><div class="stage"><div class="track">${[-1,0,1].map(d=>`<div class="large photo" style="--h:${170+(i+d)*27%160}"></div>`).join('')}</div></div><div class="foot"><button data-prev>‹</button><span>${i+1} / 108</span><button data-info>ⓘ</button><button data-next>›</button></div><div class="drawer"><h3>12 October 2026</h3><p class="muted">IMG_0124.HEIC</p><dl><dt>Photo</dt><dd>4032 × 3024 · HEIF</dd><dt>Camera</dt><dd>Example camera</dd><dt>Lens</dt><dd>24 mm · ƒ/1.8</dd><dt>Exposure</dt><dd>1/125 s · ISO 80</dd></dl><button data-info>Close information</button></div>`;shell.append(v);let track=v.querySelector('.track');track.scrollLeft=track.clientWidth+12;
let drag=null;track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;drag=[e.clientX,track.scrollLeft];track.setPointerCapture(e.pointerId);track.style.scrollSnapType='none'});
track.addEventListener('pointermove',e=>{if(drag)track.scrollLeft=drag[1]+drag[0]-e.clientX});
track.addEventListener('pointerup',()=>{if(!drag)return;drag=null;track.style.scrollSnapType='x mandatory';track.scrollTo({left:Math.round(track.scrollLeft/(track.clientWidth+12))*(track.clientWidth+12),behavior:document.body.classList.contains('reduced')?'instant':'smooth'})});
v.querySelector('.stage').addEventListener('click',()=>v.classList.toggle('hidden'))}
function consent(){shell.insertAdjacentHTML('beforeend',`<div class="scrim"><section class="dialog"><h2>Load photos from iCloud?</h2><p>Download previews for browsing. This uses your network connection and does not start a backup.</p><div class="actions"><button data-decline>Not now</button><button class="primary" data-allow>Allow loading</button></div></section></div>`)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.platform){platform=b.dataset.platform;paint()}else if(b.dataset.route){route=b.dataset.route;paint()}else if(b.id==='consent')consent();else if(b.hasAttribute('data-decline')||b.hasAttribute('data-allow')){cloud=b.hasAttribute('data-allow');b.closest('.scrim').remove()}else if(b.dataset.density){const start=density,end=+b.dataset.density,t0=performance.now();function step(t){let p=Math.min(1,(t-t0)/300),ease=1-Math.pow(1-p,3);density=start+(end-start)*ease;layout(density);if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}else if(b.dataset.photo)viewer(+b.dataset.photo);else if(b.hasAttribute('data-close'))b.closest('.viewer').remove();else if(b.hasAttribute('data-info'))b.closest('.viewer').classList.toggle('info');else if(b.hasAttribute('data-prev')||b.hasAttribute('data-next')){b.closest('.viewer').remove();viewer(Math.max(0,Math.min(107,selected+(b.hasAttribute('data-next')?1:-1))))}else if(b.dataset.type){types.has(b.dataset.type)?types.delete(b.dataset.type):types.add(b.dataset.type);paint()}else if(b.dataset.album){let i=+b.dataset.album;restricted=true;albums.has(i)?albums.delete(i):albums.add(i);restricted=albums.size>0;b.querySelector('.check').textContent=albums.has(i)?'✓':''}else if(b.dataset.go==='all-albums'){restricted=false;albums.clear();paint()}else if(b.dataset.go==='cloud-toggle'){cloud=!cloud;paint()}else if(b.dataset.go!=='noop'){route=b.dataset.go==='back'?'scope':b.dataset.go;paint()}});
document.addEventListener('input',e=>{if(e.target.id==='density'){density=+e.target.value;layout(density)}if(e.target.classList.contains('search'))shell.querySelectorAll('[data-album]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()))});document.querySelector('#reduce').onchange=e=>document.body.classList.toggle('reduced',e.target.checked);paint();
</script></html>
