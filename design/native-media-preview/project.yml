name: MediaInteractionPreview
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  MediaInteractionPreview:
    type: application
    platform: iOS
    sources:
      - path: Preview.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.design.media
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Media Design Preview
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  MediaInteractionPreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InteractionTests.swift
    dependencies:
      - target: MediaInteractionPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.design.media.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MediaInteractionPreview:
    build:
      targets:
        MediaInteractionPreview: all
    test:
      targets:
        - MediaInteractionPreviewUITests
