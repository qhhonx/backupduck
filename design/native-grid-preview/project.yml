name: CalendarGridPreview
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  CalendarGridPreview:
    type: application
    platform: iOS
    sources:
      - path: Preview.swift
      - path: GridScene.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.design.grid
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calendar Grid Preview
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  CalendarGridPreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InteractionTests.swift
    dependencies:
      - target: CalendarGridPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.design.grid.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CalendarGridPreview:
    build:
      targets:
        CalendarGridPreview: all
    test:
      targets:
        - CalendarGridPreviewUITests
