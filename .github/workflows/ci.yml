name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --test site/tests/*.test.mjs
      - run: node --check site/app.js
      - run: python3 scripts/export-design-tokens.py --check
      - run: python3 scripts/check-design-literals.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_design_tokens.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_third_party_licenses.py'
      - run: python3 scripts/check-release.py
      - run: node --check crates/native/src/dashboard/app.js
      - run: python3 scripts/audit-public.py --documentation
      - run: python3 -m unittest discover -s scripts/tests -p 'test_testflight_trigger.py'
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy -p backupduck-native --features folder-source --all-targets --locked -- -D warnings
      - run: cargo test -p backupduck-native --features folder-source --locked
      - run: python scripts/check-folder-isolation.py
      - run: cargo build --workspace --locked
      - run: python tests/cli_smoke.py

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo fetch --locked
      - run: scripts/test-ios-ci.sh
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Show Apple build toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk macosx --show-sdk-version
      - run: rustup target add aarch64-apple-darwin
      - run: cargo fetch --locked
      - run: scripts/build-macos.sh
      - run: python3 apps/apple/Scripts/generate-third-party-licenses.py --platform ios --check
      - run: python3 apps/apple/Scripts/generate-third-party-licenses.py --platform mac --check
      - run: scripts/test-folder-native.sh
      - name: Compile the sandboxed TestFlight target without distribution credentials
        run: >-
          xcodebuild -project apps/macos/BackupDuck.xcodeproj
          -scheme BackupDuckStore -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath build/macos-store-ci
          CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: rustup target add aarch64-linux-android
      - run: sdkmanager 'platforms;android-36' 'ndk;27.1.12297006'
      - run: scripts/build-android.sh
      - run: python3 apps/apple/Scripts/generate-third-party-licenses.py --platform android --check
      - run: ./gradlew testDebugUnitTest
        working-directory: apps/android
      - run: ./gradlew assembleDebugAndroidTest
        working-directory: apps/android
