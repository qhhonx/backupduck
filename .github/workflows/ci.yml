name: Probe macOS native test environment
on:
  push:
    branches: ['codex/0.6.0-macos-probe']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          sw_vers
          xcodebuild -version
          xcrun swift scripts/probe-macos-graphics.swift
