plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def releaseInfo = new groovy.json.JsonSlurper().parse(file("../../../release.json"))
android {
    namespace 'app.backupduck'
    buildFeatures { buildConfig true }
    compileSdk 36
    ndkVersion "27.1.12297006"
    defaultConfig {
        applicationId 'app.backupduck'
        minSdk 29
        targetSdk 34
        testInstrumentationRunner "app.backupduck.ReceiverInstrumentation"
        versionCode releaseInfo.build as int
        versionName releaseInfo.version
        // Install native acceptance tests beside the user's real receiver.
        if (project.hasProperty('validationApp')) {
            applicationId 'app.backupduck.validation'
            versionName releaseInfo.version + '-validation'
        }
        // Isolated update-verification host; never changes the production package.
        if (project.hasProperty('updateFixture')) {
            applicationId 'app.backupduck.updatefixture'
            versionCode = Integer.parseInt(project.findProperty('fixtureBuild')?.toString() ?: '1')
        }
        manifestPlaceholders = [
            appLabel: project.hasProperty('validationApp') ? 'BackupDuck Validation' : '@string/app_name',
            photosProbeLabel: project.hasProperty('validationApp') ? 'BackupDuck Validation — Photos space management' : '@string/photos_probe_title'
        ]
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                // Preserve the release certificate without binding branding to an entry name.
                def signingStore = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
                storeFile.withInputStream { signingStore.load(it, storePassword.toCharArray()) }
                def signingAliases = signingStore.aliases().toList().findAll { signingStore.isKeyEntry(it) }
                if (signingAliases.size() != 1 && !System.getenv('ANDROID_KEY_ALIAS')) {
                    throw new GradleException('Set ANDROID_KEY_ALIAS when the signing store has multiple key entries')
                }
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: signingAliases.first()
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
        debug { versionNameSuffix '-dev' }
        // Design catalog: production pages on scenario data, in release configuration
        // so motion and old-device performance can be judged. Never distributed.
        catalog {
            initWith release
            applicationIdSuffix '.catalog'
            versionNameSuffix '-catalog'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            manifestPlaceholders = [appLabel: 'Duck Catalog', photosProbeLabel: 'Duck Catalog']
        }
    }
    kotlinOptions { jvmTarget = "17" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.annotation:annotation:1.9.1'; implementation 'com.google.zxing:core:3.5.3'; implementation 'androidx.media3:media3-transformer:1.5.1'; implementation 'androidx.exifinterface:exifinterface:1.3.7' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.recyclerview:recyclerview-selection:1.1.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
}
