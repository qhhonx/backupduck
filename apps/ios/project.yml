name: BackupDuck
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  Release: release
  ScanValidation: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
configFiles:
  Debug: ../apple/Signing.xcconfig
  Release: ../apple/Signing.xcconfig
  ScanValidation: ScanValidation.xcconfig
targets:
  BackupDuck:
    type: application
    platform: iOS
    sources:
      - path: ../apple/Shared
      - path: ../apple/Resources
        excludes: ["ThirdPartyNotices-mac*.txt"]
      - path: BackupDuck
        excludes: [Info.plist]
      - path: ActivityShared
    dependencies:
      - target: BackupDuckLiveActivity
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck
        INFOPLIST_FILE: BackupDuck/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Simulator.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ../../crates/native/include/backupduck.h
        TARGETED_DEVICE_FAMILY: '1,2'
        OTHER_LDFLAGS: &native_link
          - $(inherited)
          - '$(BUILT_PRODUCTS_DIR)/libbackupduck_native.a'
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          - -lsqlite3
          - -lz
          - -liconv
      configs:
        ScanValidation:
          PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.validation
          INFOPLIST_FILE: ScanValidation/Info.plist
          CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: ScanValidation/Simulator.entitlements
          ARCHS: arm64
    preBuildScripts: &native_engine
      - name: Build shared Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_PROFILE_RELEASE_STRIP=none
          export IPHONEOS_DEPLOYMENT_TARGET=18.0
          case "$PLATFORM_NAME" in
            iphonesimulator) rust_target=aarch64-apple-ios-sim;;
            iphoneos) rust_target=aarch64-apple-ios;;
            *) exit 1;;
          esac
          cd "$SRCROOT/../.."
          cargo fetch --locked
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cargo build --locked --release -p backupduck-native --no-default-features --target "$rust_target"
          cp "target/$rust_target/release/libbackupduck_native.a" "$BUILT_PRODUCTS_DIR/"
          python3 apps/apple/Scripts/generate-third-party-licenses.py --platform ios --check
  BackupDuckCatalog:
    # Design catalog: production pages on scenario data. Never distributed.
    type: application
    platform: iOS
    sources:
      - path: ../apple/Shared
      - path: ../apple/Resources
        excludes: ["*.lproj/InfoPlist.strings", "ThirdPartyNotices-mac*.txt"]
      - path: BackupDuck
        excludes: [Info.plist, BackupDuckApp.swift]
      - path: Catalog
        excludes: [Info.plist]
      - path: ActivityShared
      - path: LiveActivity/BackupActivityView.swift
      - path: ../apple/Catalog
        excludes: [README.md, Scenarios]
      - path: ../apple/Catalog/Scenarios
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.catalog
        INFOPLIST_FILE: Catalog/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: ../../crates/native/include/backupduck.h
        TARGETED_DEVICE_FAMILY: '1,2'
        OTHER_LDFLAGS: *native_link
    preBuildScripts: *native_engine
  BackupDuckLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ActivityShared
      - path: LiveActivity
        excludes: [Info.plist]
      - path: ../apple/Shared/DuckTokens.swift
      - path: ../apple/Resources
        includes: ["*.lproj/Localizable.strings"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.LiveActivity
        INFOPLIST_FILE: LiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BACKUPDUCK_WIDGET
      configs:
        ScanValidation:
          PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.validation.LiveActivity
          INFOPLIST_FILE: ScanValidation/LiveActivityInfo.plist
          ARCHS: arm64
  BackupDuckCatalogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CatalogTests]
    dependencies:
      - target: BackupDuckCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.catalog.tests
        GENERATE_INFOPLIST_FILE: YES
  BackupDuckTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BackupDuck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.tests
        GENERATE_INFOPLIST_FILE: YES
  BackupDuckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BackupDuck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BackupDuck:
    build:
      targets:
        BackupDuck: all
    run:
      config: Release
    test:
      targets: [BackupDuckTests]
  BackupDuckUI:
    build:
      targets:
        BackupDuck: all
        BackupDuckUITests: [test]
    test:
      targets: [BackupDuckUITests]
  BackupDuckCatalog:
    build:
      targets:
        BackupDuckCatalog: all
    run:
      config: Release
    test:
      config: Release
      targets: [BackupDuckCatalogTests]
