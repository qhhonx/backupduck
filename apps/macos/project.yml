name: BackupDuck
options:
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
configFiles:
  Debug: ../apple/Signing.xcconfig
  Release: ../apple/Signing.xcconfig
targetTemplates:
  MacHost:
    type: application
    platform: macOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: ../../crates/native/include/backupduck.h
        OTHER_LDFLAGS:
          - $(inherited)
          - '$(BUILT_PRODUCTS_DIR)/libbackupduck_native.a'
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          - -lsqlite3
          - -lz
          - -liconv
    preBuildScripts:
      - name: Build shared Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_PROFILE_RELEASE_STRIP=none
          cd "$SRCROOT/../.."
          cargo fetch --locked
          export MACOSX_DEPLOYMENT_TARGET=15.0
          case "$TARGET_NAME" in BackupDuckStore|BackupDuckCatalog) ;; *) ./scripts/fetch-sparkle.sh;; esac
          cargo build --locked --release --target aarch64-apple-darwin -p backupduck-native --features folder-source
          cp target/aarch64-apple-darwin/release/libbackupduck_native.a "$BUILT_PRODUCTS_DIR/"
          python3 apps/apple/Scripts/generate-third-party-licenses.py --platform mac --check
targets:
  BackupDuck:
    templates: [MacHost]
    sources: &app_sources
      - path: BackupDuck
        excludes: [Info.plist, StoreInfo.plist, Store.entitlements]
      - path: ../apple/Shared
      - path: ../apple/Resources
        excludes: ["ThirdPartyNotices-ios.txt", "ThirdPartyNotices-mac.txt"]
    dependencies:
      - framework: ../../build/dependencies/sparkle/Sparkle.framework
        embed: true
    settings:
      base:
        INFOPLIST_FILE: BackupDuck/Info.plist
        CODE_SIGN_IDENTITY: '-'
  BackupDuckStore:
    templates: [MacHost]
    sources:
      - path: BackupDuck
        excludes: [Info.plist, StoreInfo.plist, Store.entitlements]
      - path: ../apple/Shared
      - path: ../apple/Resources
        excludes: ["ThirdPartyNotices-ios.txt", "ThirdPartyNotices-mac-sparkle.txt"]
    settings:
      base:
        PRODUCT_NAME: BackupDuck
        INFOPLIST_FILE: BackupDuck/StoreInfo.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: BackupDuck/Store.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BACKUPDUCK_APP_STORE
        ENABLE_HARDENED_RUNTIME: YES
  BackupDuckCatalog:
    # Design catalog: the production workspace on scenario data. Never distributed.
    templates: [MacHost]
    sources:
      - path: BackupDuck
        excludes: [Info.plist, StoreInfo.plist, Store.entitlements, MacAppMain.swift]
      - path: ../apple/Shared
      - path: ../apple/Resources
        excludes: ["*.lproj/InfoPlist.strings", "ThirdPartyNotices-ios.txt", "ThirdPartyNotices-mac-sparkle.txt"]
      - path: Catalog
        excludes: [Info.plist]
      - path: ../apple/Catalog
        excludes: [README.md, Scenarios]
      - path: ../apple/Catalog/Scenarios
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BackupDuckCatalog
        PRODUCT_BUNDLE_IDENTIFIER: app.backupduck.catalog
        INFOPLIST_FILE: Catalog/Info.plist
        CODE_SIGN_IDENTITY: '-'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BACKUPDUCK_APP_STORE
schemes:
  BackupDuck:
    build:
      targets:
        BackupDuck: all
    run:
      config: Debug
  BackupDuckStore:
    build:
      targets:
        BackupDuckStore: all
    run:
      config: Debug
    archive:
      config: Release
  BackupDuckCatalog:
    build:
      targets:
        BackupDuckCatalog: all
    run:
      config: Release
